version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: apms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - apms_network

  backend:
    build:
      context: ./apms_backend
    container_name: apms_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - JWT_SECRET=${JWT_SECRET:-apms_super_secret_key_2026}
    depends_on:
      - postgres_db
    networks:
      - apms_network

  ai_service:
    build:
      context: ./apms_ai_service
    container_name: apms_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres_db
    networks:
      - apms_network

  ocr_service:
    build:
      context: ./ocr_service
    container_name: ocr_service
    restart: always
    ports:
      - "8001:8000"
    networks:
      - apms_network

  apms_frontend:
    build:
      context: ./apms
    container_name: apms_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - apms_network

volumes:
  pgdata:

networks:
  apms_network:
    driver: bridge
